name: Installateur Windows

# Se lance quand on publie une version (étiquette v1.0.0, v1.1.0…)
# ou à la main depuis l'onglet « Actions » de GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Fabriquer l'installateur
        run: npm run dist:win

      - name: Conserver les fichiers (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Louange-Windows
          path: |
            release/*.exe
            release/*.zip

      - name: Publier dans « Releases »
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Louange ${{ github.ref_name }}
          body: |
            **Installation :** téléchargez `Louange-Setup-${{ github.ref_name }}.exe` ci-dessous et lancez-le.
            Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* → *Exécuter quand même*.

            Version sans installation : `Louange-…-win.zip` (décompresser puis lancer `Louange.exe`).
          files: |
            release/*.exe
            release/*.zip
