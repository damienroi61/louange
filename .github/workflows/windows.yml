name: Installateur Windows

# Se lance quand on publie une « Release » sur GitHub (étiquette v1.0.0, v1.1.0…) :
# l'installateur y est ajouté automatiquement.
# Peut aussi être lancé à la main depuis l'onglet « Actions ».
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Fabriquer l'installateur
        run: npm run dist:win

      - name: Conserver les fichiers (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Louange-Windows
          path: |
            release/*.exe
            release/*.zip

      - name: Ajouter l'installateur à la Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
